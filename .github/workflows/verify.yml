name: Verify MDEV-42453 (dyncol backwritenum stack-buffer-overflow)

# Scratch runtime verification ONLY. Builds MariaDB mysys unittest ma_dyncol-t
# with AddressSanitizer, reproduces the stack-buffer-overflow WRITE in
# backwritenum/find_column BEFORE the fix (large numeric lookup key on a
# string-format dynamic column), applies the fix, shows it is gone AFTER.
# Never commits to or opens a PR against MariaDB/server upstream.

on:
  workflow_dispatch:
    inputs:
      mdb_ref:
        description: MariaDB/server branch or commit to verify
        required: false
        default: main
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-42453-${{ github.ref }}-${{ inputs.mdb_ref || 'main' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
    - name: Free Disk Space
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL || true
        df -h /

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake bison git perl pkg-config \
          libncurses5-dev libssl-dev libaio-dev libpcre2-dev zlib1g-dev \
          libcurl4-openssl-dev libxml2-dev liblzma-dev liblz4-dev libzstd-dev \
          libsnappy-dev libjemalloc-dev libnuma-dev libsystemd-dev libboost-dev

    - name: Checkout MariaDB/server
      uses: actions/checkout@v4
      with:
        repository: MariaDB/server
        ref: ${{ inputs.mdb_ref || 'main' }}
        path: mariadb
        fetch-depth: 1
        submodules: false

    - name: Checkout verification tools (this repo)
      uses: actions/checkout@v4
      with:
        path: tools

    - name: Resolve parameters
      run: |
        set -euo pipefail
        sha=$(git -C mariadb rev-parse HEAD)
        {
          echo "SRC_DIR=${GITHUB_WORKSPACE}/mariadb"
          echo "TOOLS_DIR=${GITHUB_WORKSPACE}/tools"
          echo "RESULTS_DIR=${GITHUB_WORKSPACE}/results"
          echo "BUILD_DIR=${GITHUB_WORKSPACE}/build"
          echo "MDB_SHA=${sha}"
        } | tee -a "$GITHUB_ENV"
        mkdir -p "${GITHUB_WORKSPACE}/results" "${GITHUB_WORKSPACE}/build"
        echo "MariaDB commit: ${sha}"
        printf '%s\n' "${sha}" > "${GITHUB_WORKSPACE}/mdb-sha.txt"

    - name: Add MDEV-42453 regression test (test-only, no code fix yet)
      run: |
        set -eo pipefail
        cd "${SRC_DIR}"
        git apply --verbose --include='unittest/mysys/ma_dyncol-t.c' "${TOOLS_DIR}/fix.patch"
        grep -n "test_mdev_42453" unittest/mysys/ma_dyncol-t.c | head

    - name: CMake configure (ASan, Debug, unit tests, engines off)
      run: |
        set -eo pipefail
        cd "${BUILD_DIR}"
        cmake "${SRC_DIR}" \
          -DCMAKE_BUILD_TYPE=Debug \
          -DWITH_ASAN=ON \
          -DWITH_SAFEMALLOC=OFF \
          -DWITH_SSL=system \
          -DWITH_UNIT_TESTS=ON \
          -DUPDATE_SUBMODULES=ON \
          -DWITH_WSREP=OFF \
          -DWITH_MARIABACKUP=OFF \
          -DWITHOUT_MARIABACKUP=1 \
          -DPLUGIN_ROCKSDB=NO \
          -DPLUGIN_COLUMNSTORE=NO \
          -DPLUGIN_MROONGA=NO \
          -DPLUGIN_OQGRAPH=NO \
          -DPLUGIN_SPHINX=NO \
          -DPLUGIN_TOKUDB=NO \
          -DPLUGIN_CONNECT=NO \
          -DPLUGIN_SPIDER=NO \
          -DPLUGIN_PERFSCHEMA=NO \
          -DWITH_MARIAS3=OFF \
          > "${RESULTS_DIR}/cmake_configure.log" 2>&1 && rc=0 || rc=$?
        echo "configure_exit=${rc}" | tee -a "${RESULTS_DIR}/cmake_configure.log"
        tail -n 40 "${RESULTS_DIR}/cmake_configure.log"
        exit ${rc}

    - name: Build ma_dyncol-t BEFORE fix
      run: |
        set -eo pipefail
        cd "${BUILD_DIR}"
        cmake --build . --target ma_dyncol-t -- -j2 > "${RESULTS_DIR}/build_before.log" 2>&1
        tail -n 15 "${RESULTS_DIR}/build_before.log"
        find "${BUILD_DIR}" -name 'ma_dyncol-t' -type f | tee "${RESULTS_DIR}/binpath.txt"

    - name: BEFORE fix - run unittest (expect ASan stack-buffer-overflow)
      run: |
        set -uo pipefail
        BIN=$(head -1 "${RESULTS_DIR}/binpath.txt")
        echo "binary: ${BIN}"
        ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 "${BIN}" > "${RESULTS_DIR}/unit_before.log" 2>&1 && rc=0 || rc=$?
        echo "unit_before_exit=${rc}" | tee -a "${RESULTS_DIR}/unit_before.log"
        echo "=== before tail ==="; tail -n 45 "${RESULTS_DIR}/unit_before.log" || true
        if grep -q "stack-buffer-overflow" "${RESULTS_DIR}/unit_before.log" && grep -q "backwritenum" "${RESULTS_DIR}/unit_before.log"; then
          echo "OVERFLOW_DETECTED_BEFORE" > "${RESULTS_DIR}/unit_before.verdict"
        elif [ "${rc}" -ne 0 ]; then
          echo "FAILED_BEFORE_NO_OVERFLOW_TAG" > "${RESULTS_DIR}/unit_before.verdict"
        else
          echo "UNEXPECTED_PASS_BEFORE" > "${RESULTS_DIR}/unit_before.verdict"
        fi
        cat "${RESULTS_DIR}/unit_before.verdict"

    - name: Apply code fix
      run: |
        set -eo pipefail
        cd "${SRC_DIR}"
        git apply --verbose --include='include/ma_dyncol.h' --include='mysys/ma_dyncol.c' "${TOOLS_DIR}/fix.patch"
        echo "=== DYNCOL_NUM_KEY_MAX guard now present ==="; grep -n "DYNCOL_NUM_KEY_MAX" mysys/ma_dyncol.c

    - name: Build ma_dyncol-t AFTER fix (incremental)
      run: |
        set -eo pipefail
        cd "${BUILD_DIR}"
        cmake --build . --target ma_dyncol-t -- -j2 > "${RESULTS_DIR}/build_after.log" 2>&1
        tail -n 15 "${RESULTS_DIR}/build_after.log"

    - name: AFTER fix - run unittest (expect clean pass)
      run: |
        set -uo pipefail
        BIN=$(head -1 "${RESULTS_DIR}/binpath.txt")
        ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 "${BIN}" > "${RESULTS_DIR}/unit_after.log" 2>&1 && rc=0 || rc=$?
        echo "unit_after_exit=${rc}" | tee -a "${RESULTS_DIR}/unit_after.log"
        echo "=== after tail ==="; tail -n 25 "${RESULTS_DIR}/unit_after.log" || true
        if [ "${rc}" -eq 0 ] && ! grep -q "stack-buffer-overflow" "${RESULTS_DIR}/unit_after.log"; then
          echo "OVERFLOW_CLEAN_AFTER" > "${RESULTS_DIR}/unit_after.verdict"
        else
          echo "OVERFLOW_STILL_PRESENT" > "${RESULTS_DIR}/unit_after.verdict"
        fi
        cat "${RESULTS_DIR}/unit_after.verdict"

    - name: Assert before/after contrast
      run: |
        set -uo pipefail
        cd "${RESULTS_DIR}"
        ok=1
        ub=$(cat unit_before.verdict 2>/dev/null || echo MISSING)
        ua=$(cat unit_after.verdict 2>/dev/null || echo MISSING)
        echo "unit_before=${ub} unit_after=${ua}"
        if [ "${ub}" != "OVERFLOW_DETECTED_BEFORE" ] && [ "${ub}" != "FAILED_BEFORE_NO_OVERFLOW_TAG" ]; then
          echo "::error::unittest did not fail before fix (${ub})."; ok=0
        fi
        if [ "${ua}" != "OVERFLOW_CLEAN_AFTER" ]; then
          echo "::error::unittest not clean after fix (${ua})."; ok=0
        fi
        {
          echo "# MDEV-42453 runtime verification"
          echo "- MariaDB commit: $(cat ${GITHUB_WORKSPACE}/mdb-sha.txt)"
          echo "- ma_dyncol-t unittest (ASan): before=${ub}, after=${ua}"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "${ok}" = "1" ]; then
          echo "PASS: MDEV-42453 overflow reproduced before fix and gone after." | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "FAIL: verification assertions failed." >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Upload logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: verify-42453-logs
        path: |
          results/*.log
          results/*.verdict
          results/binpath.txt
          mdb-sha.txt
        retention-days: 30